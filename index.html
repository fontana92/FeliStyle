<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feli_Style Barbería | Reservas Premium</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0a0a0a;
            --accent: #c9a86a;
            --accent-light: #e6d7b8;
            --light: #f8f8f8;
            --white: #ffffff;
            --success: #2ecc71;
            --border: #e0e0e0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f7ef8a 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--white); color: var(--primary); line-height: 1.6; overflow-x: hidden; }
        h1, h2, h3, h4, .section-title { font-family: 'Poppins', sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        header {
            background: rgba(10, 10, 10, 0.98); color: white; padding: 1.2rem 0; position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 50px; width: auto; border-radius: 8px; border: 1.5px solid var(--accent); }
        .logo h1 { font-size: 1.4rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .social-link { color: var(--accent); font-size: 1.5rem; text-decoration: none; transition: 0.3s; }
        .social-link:hover { color: white; transform: scale(1.1); }

        .hero {
            text-align: center; padding: 60px 20px; color: white; margin-bottom: 30px; border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=2074');
            background-size: cover; background-position: center;
        }

        /* GALERIA INTERACTIVA */
        .gallery-section { padding: 20px 0; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 10px; }
        .gallery-item { 
            height: 250px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); 
            box-shadow: var(--shadow); position: relative; cursor: pointer;
        }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .gallery-item:hover img { transform: scale(1.1); filter: brightness(0.7); }
        .gallery-title { 
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; 
            background: rgba(0,0,0,0.6); color: var(--accent); text-align: center; 
            font-weight: 700; font-size: 0.9rem; text-transform: uppercase;
        }

        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .service-card { 
            background: white; border-radius: var(--radius-md); padding: 25px; border: 1px solid var(--border); 
            cursor: pointer; transition: var(--transition);
        }
        .service-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .service-card.selected { border: 2.5px solid var(--accent); background: #fffcf5; }
        .service-icon { font-size: 2rem; color: var(--accent); margin-bottom: 10px; }
        .service-price { font-size: 1.5rem; font-weight: 700; color: var(--primary); }

        .calendar-container { background: white; border-radius: var(--radius-lg); padding: 25px; border: 1px solid var(--border); margin-bottom: 25px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .calendar-day-header { text-align: center; font-weight: 700; font-size: 0.7rem; color: #999; text-transform: uppercase; }
        .calendar-day { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border-radius: 10px; border: 1px solid #f0f0f0; transition: 0.2s;
        }
        .calendar-day:hover:not(.disabled) { background: var(--accent-light); }
        .calendar-day.selected { background: var(--accent) !important; color: white !important; font-weight: bold; border-color: var(--accent); }
        .calendar-day.disabled { color: #ccc; cursor: not-allowed; background: #fafafa; border: none; }
        .calendar-day.today { border: 2px solid var(--accent); color: var(--accent); font-weight: 700; }

        .time-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; margin-top: 20px; }
        .time-slot { padding: 12px; text-align: center; background: var(--light); border-radius: 10px; cursor: pointer; font-weight: 600; border: 1.5px solid transparent; transition: 0.3s; }
        .time-slot.selected { background: var(--accent); color: white; }
        .time-slot.occupied { background: #e0e0e0; color: #aaa; cursor: not-allowed; text-decoration: line-through; pointer-events: none; }

        .booking-form { background: white; border-radius: var(--radius-lg); padding: 30px; border: 1px solid var(--border); margin-bottom: 50px; }
        .form-input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; font-size: 1rem; }
        .btn-primary { width: 100%; padding: 18px; background: var(--primary); color: white; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; }

        .section-title { text-align: center; font-size: 1.7rem; margin: 40px 0 20px; position: relative; padding-bottom: 10px; }
        .section-title:after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 50px; height: 3px; background: var(--accent); }
        .hidden { display: none !important; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 40px; border-radius: var(--radius-lg); text-align: center; max-width: 400px; width: 100%; }

        footer { 
            padding: 40px 0; text-align: center; border-top: 1px solid #eee; background: #fafafa;
            color: #666; font-size: 0.9rem; letter-spacing: 1px;
        }
        .footer-brand { font-weight: 800; color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="logo">
                <img src="https://i.postimg.cc/s2dsJwRZ/IMG-20260122-WA0001.jpg" class="logo-img">
                <h1>Feli_Style</h1>
            </div>
            <div style="display: flex; gap: 20px;">
                <a href="https://www.instagram.com/felistyle_/" target="_blank" class="social-link"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/5491123517723" target="_blank" class="social-link"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Experiencia Premium</h2>
            <p>Reserva tu lugar en segundos.</p>
        </section>

        <!-- GALERIA CON NAVEGACIÓN -->
        <section class="gallery-section">
            <h3 class="section-title">Trabajos Reales</h3>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="selectServiceByTitle('1')">
                    <img src="https://i.postimg.cc/zGD5m28n/IMG-20260212-WA0005.jpg">
                    <div class="gallery-title">Corte de Cabello</div>
                </div>
                <div class="gallery-item" onclick="selectServiceByTitle('3')">
                    <img src="https://i.postimg.cc/T32G8NfQ/IMG-20260212-WA0003.jpg">
                    <div class="gallery-title">Arreglo de Barba</div>
                </div>
                <div class="gallery-item" onclick="selectServiceByTitle('6')">
                    <img src="https://i.postimg.cc/sgfyFHsT/IMG-20260212-WA0006.jpg">
                    <div class="gallery-title">Perfilado de Ceja</div>
                </div>
            </div>
        </section>

        <section id="services">
            <h3 class="section-title">Nuestros Servicios</h3>
            <div class="services-grid" id="services-container"></div>
        </section>

        <section class="calendar-section hidden" id="calendar-section">
            <h3 class="section-title">Selecciona Fecha</h3>
            <div class="calendar-container">
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)" style="border:none; background:none; cursor:pointer;"><i class="fas fa-chevron-left"></i></button>
                    <span id="current-month-name"></span>
                    <button onclick="changeMonth(1)" style="border:none; background:none; cursor:pointer;"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid" id="calendar-days"></div>
            </div>
            
            <div id="time-container" class="calendar-container hidden">
                <h4 style="text-align: center; margin-bottom: 15px;">Horarios disponibles</h4>
                <div class="time-slots" id="time-slots"></div>
            </div>
        </section>

        <section class="booking-form hidden" id="booking-form">
            <h3 class="section-title">Tus Datos</h3>
            <input type="text" class="form-input" id="client-name" placeholder="Tu nombre completo">
            <input type="tel" class="form-input" id="client-phone" placeholder="WhatsApp (Ej: 11 1234 5678)">
            <button class="btn-primary" onclick="confirmBooking()">Finalizar Reserva</button>
        </section>
    </main>

    <div class="modal" id="confirmation-modal">
        <div class="modal-content">
            <i class="fas fa-check-circle" style="font-size: 3rem; color: var(--success); margin-bottom: 15px;"></i>
            <h3>¡Turno Reservado!</h3>
            <p id="confirmation-details" style="margin: 15px 0; font-size: 0.9rem;"></p>
            <button class="btn-primary" onclick="location.reload()">Cerrar</button>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Hecho con <i class="fas fa-heart" style="color: #e74c3c;"></i> por <span class="footer-brand">Fontana Designs</span></p>
        </div>
    </footer>

    <script>
        // --- CONFIGURACIÓN SUPABASE ---
        const SUPABASE_URL = "https://acumbghpdubforsfifyd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_aYOgFkyaRa7sNX82xRojEw_uUkgAzME";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const SERVICES = [
            { id: '1', name: 'Corte de Cabello', price: 9000, icon: 'cut' },
            { id: '2', name: 'Corte Niños', price: 7000, icon: 'child' },
            { id: '3', name: 'Arreglo de Barba', price: 2000, icon: 'user-tie' },
            { id: '4', name: 'Afeitado Tradicional', price: 3000, icon: 'hand-sparkles' },
            { id: '5', name: 'Perfilado de Ceja', price: 2000, icon: 'eye' },
            { id: '6', name: 'Corte + Barba', price: 10000, icon: 'crown' },
            { id: '7', name: 'Pelo + Barba + Ceja', price: 12000, icon: 'star' }
        ];

        const ALL_SLOTS = ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00"];

        let selectedService = null;
        let selectedDate = null;
        let selectedTime = null;
        let occupiedSlots = [];
        let viewDate = new Date();

        function renderServices() {
            const container = document.getElementById('services-container');
            container.innerHTML = SERVICES.map(s => `
                <div class="service-card" onclick="selectService('${s.id}')" id="service-${s.id}">
                    <div class="service-icon"><i class="fas fa-${s.icon}"></i></div>
                    <div class="service-price">$${s.price.toLocaleString()}</div>
                    <h4 style="margin:5px 0">${s.name}</h4>
                </div>
            `).join('');
        }

        function selectService(id) {
            selectedService = SERVICES.find(s => s.id === id);
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(`service-${id}`).classList.add('selected');
            document.getElementById('calendar-section').classList.remove('hidden');
            renderCalendar();
            document.getElementById('calendar-section').scrollIntoView({ behavior: 'smooth' });
        }

        function selectServiceByTitle(id) {
            selectService(id);
            document.getElementById('services').scrollIntoView({ behavior: 'smooth' });
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-days');
            const monthLabel = document.getElementById('current-month-name');
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const names = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            
            monthLabel.innerText = `${names[month]} ${year}`;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = ["D","L","M","M","J","V","S"].map(d => `<div class="calendar-day-header">${d}</div>`).join('');
            for(let i=0; i<firstDay; i++) html += `<div class="calendar-day disabled"></div>`;
            
            const today = new Date(); today.setHours(0,0,0,0);

            for(let d=1; d<=daysInMonth; d++) {
                const date = new Date(year, month, d);
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isPast = date < today;
                const isSelected = selectedDate === dateStr;
                html += `<div class="calendar-day ${isPast ? 'disabled' : ''} ${isSelected ? 'selected' : ''} ${date.toDateString() === new Date().toDateString() ? 'today' : ''}" 
                             onclick="${isPast ? '' : `selectDate('${dateStr}')`}">${d}</div>`;
            }
            container.innerHTML = html;
        }

        async function selectDate(dateStr) {
            selectedDate = dateStr;
            renderCalendar();
            const { data } = await _supabase.from('agenda_turnos').select('hora').eq('fecha', dateStr);
            occupiedSlots = data ? data.map(t => t.hora) : [];
            document.getElementById('time-container').classList.remove('hidden');
            renderTimeSlots();
        }

        function renderTimeSlots() {
            const container = document.getElementById('time-slots');
            container.innerHTML = ALL_SLOTS.map(t => {
                const isOccupied = occupiedSlots.includes(t);
                return `<div class="time-slot ${selectedTime === t ? 'selected' : ''} ${isOccupied ? 'occupied' : ''}" 
                             onclick="${isOccupied ? '' : `selectTime('${t}')`}">${t}</div>`;
            }).join('');
        }

        function selectTime(t) {
            selectedTime = t;
            renderTimeSlots();
            document.getElementById('booking-form').classList.remove('hidden');
            document.getElementById('booking-form').scrollIntoView({ behavior: 'smooth' });
        }

        async function confirmBooking() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            if(!name || !phone) return alert("Por favor completa tus datos.");

            const { error } = await _supabase.from('agenda_turnos').insert([{
                fecha: selectedDate, hora: selectedTime, servicio: selectedService.name, cliente_nombre: name, cliente_whatsapp: phone
            }]);

            if(error) return alert("Error al reservar: " + error.message);

            const fechaLabel = new Date(selectedDate + "T00:00:00").toLocaleDateString('es-AR');
            document.getElementById('confirmation-details').innerHTML = `<b>${selectedService.name}</b><br>${fechaLabel} a las ${selectedTime} hs.`;
            document.getElementById('confirmation-modal').classList.add('active');

            const msg = window.encodeURIComponent(`¡Hola Feli_Style! Reservé un turno:\n👤 ${name}\n✂️ ${selectedService.name}\n📅 ${fechaLabel}\n⏰ ${selectedTime} hs.`);
            setTimeout(() => { window.open(`https://wa.me/5491123517723?text=${msg}`, '_blank'); }, 1000);
        }

        function changeMonth(v) { viewDate.setMonth(viewDate.getMonth() + v); renderCalendar(); }
        renderServices();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feli_Style Barbería | Reservas Elegantes</title>
    
    <!-- SEO Optimizado -->
    <meta name="description" content="Agenda online exclusiva para Feli_Style Barbería. Reserva tu turno para corte, arreglo de barba, afeitado y servicios premium.">
    <meta name="keywords" content="barbería, agenda online, turnos, corte de pelo, barba, afeitado, Feli_Style, estilo masculino">
    <meta name="author" content="Feli_Style Barbería">
    
    <!-- Open Graph -->
    <meta property="og:image" content="https://i.postimg.cc/s2dsJwRZ/IMG-20260122-WA0001.jpg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/s2dsJwRZ/IMG-20260122-WA0001.jpg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0a0a0a;
            --primary-dark: #000000;
            --secondary: #2a2a2a;
            --accent: #c9a86a;
            --accent-light: #e6d7b8;
            --dark: #1a1a1a;
            --light: #f8f8f8;
            --white: #ffffff;
            --gray: #777777;
            --border: #e0e0e0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f7ef8a 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--white); color: var(--dark); line-height: 1.6; overflow-x: hidden; width: 100%; font-weight: 400; }
        
        h1, h2, h3, h4, .section-title, .logo h1, .hero h2, .calendar-title { font-family: 'Poppins', sans-serif; font-weight: 600; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* Header */
        header {
            background: var(--primary); color: white; padding: 1.4rem 0; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 6px 30px rgba(0,0,0,0.15); backdrop-filter: blur(10px); background: rgba(10, 10, 10, 0.95);
        }
        
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 16px; }
        .logo-img { height: 56px; width: auto; border-radius: var(--radius-sm); border: 2px solid var(--accent); }
        .logo h1 { font-size: 1.6rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo span { font-weight: 300; font-size: 0.85rem; color: var(--accent-light); text-transform: uppercase; }

        .social-icons { display: flex; gap: 12px; }
        .social-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; transition: var(--transition); background: rgba(255, 255, 255, 0.08); }
        .social-icon.whatsapp:hover { background: #25D366; }
        .social-icon.instagram:hover { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }

        .cart-btn { 
            background: rgba(255,255,255,0.1); border: 1.5px solid var(--accent); color: var(--white);
            padding: 10px 22px; border-radius: 50px; cursor: pointer; display: flex; align-items: center; gap: 10px;
        }

        /* Hero */
        .hero {
            text-align: center; padding: 80px 20px; color: white; margin-bottom: 50px;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=2074');
            background-size: cover; background-position: center; border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }
        .hero h2 { font-size: 3rem; margin-bottom: 20px; }
        .cta-button {
            background: var(--accent); color: var(--primary); padding: 18px 42px; border-radius: 50px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: var(--transition); border: none;
        }

        /* ===== NUEVA SECCIÓN GALERÍA ===== */
        .gallery-section { padding: 60px 0; background: #fff; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .gallery-item {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            height: 350px;
            box-shadow: var(--shadow);
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .gallery-item::after {
            content: 'Ver trabajo';
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            padding: 15px;
            background: rgba(201, 168, 106, 0.9);
            color: black;
            text-align: center;
            font-weight: 700;
            transition: bottom 0.3s ease;
        }
        .gallery-item:hover::after {
            bottom: 0;
        }

        /* Títulos */
        .section-title { text-align: center; font-size: 2rem; margin-bottom: 40px; color: var(--primary); position: relative; padding-bottom: 20px; }
        .section-title:after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80px; height: 4px; background: var(--gold-gradient); border-radius: 2px; }

        /* Servicios */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
        .service-card { background: var(--white); border-radius: var(--radius-md); padding: 32px; box-shadow: var(--shadow); border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
        .service-card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .service-card.selected { border: 2px solid var(--accent); background: #fffcf5; }
        .service-icon { font-size: 2.5rem; color: var(--accent); margin-bottom: 15px; }
        .service-price { font-size: 1.5rem; font-weight: 700; color: var(--primary); }

        /* Calendario */
        .calendar-container { background: var(--white); border-radius: var(--radius-lg); padding: 35px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 30px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; overflow-x: auto; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: var(--radius-sm); border: 1px solid #eee; min-width: 45px; }
        .calendar-day.selected { background: var(--accent); color: white; font-weight: bold; }
        .calendar-day.disabled { color: #ccc; cursor: not-allowed; background: #f9f9f9; }

        .time-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-top: 20px; }
        .time-slot { padding: 12px; text-align: center; background: var(--light); border-radius: var(--radius-sm); cursor: pointer; transition: 0.3s; }
        .time-slot.selected { background: var(--accent); color: white; }

        /* Formulario */
        .booking-form { background: var(--white); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 60px; }
        .form-group { margin-bottom: 20px; }
        .form-input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; }
        .btn-primary { background: var(--primary); color: white; padding: 18px; border-radius: var(--radius-md); width: 100%; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; }

        /* Contacto */
        .contact-info { background: var(--primary); color: white; padding: 50px; border-radius: var(--radius-lg); text-align: center; }
        .contact-info h3 { margin-bottom: 20px; color: var(--accent); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: var(--radius-lg); text-align: center; }

        #notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 15px 30px; border-radius: 50px; display: none; z-index: 3000; }

        @media (max-width: 768px) {
            .hero h2 { font-size: 2rem; }
            .calendar-grid { gap: 5px; }
            .gallery-item { height: 300px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <img src="https://i.postimg.cc/s2dsJwRZ/IMG-20260122-WA0001.jpg" alt="Logo" class="logo-img">
                <div class="logo-text">
                    <h1>Feli_Style</h1>
                    <span>Excelencia en Corte</span>
                </div>
            </div>
            <div class="social-icons">
                <a href="#" class="social-icon whatsapp"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="social-icon instagram"><i class="fab fa-instagram"></i></a>
            </div>
            <button class="cart-btn" id="cart-btn">
                <i class="fas fa-calendar-check"></i> <span id="cart-count">0</span>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Experiencia Barbería Premium</h2>
            <p>El estilo que buscás, con la atención que merecés.</p>
            <button class="cta-button" onclick="scrollToServices()">Reservar Turno</button>
        </section>

        <!-- NUEVA SECCIÓN DE GALERÍA (Reemplaza al QR) -->
        <section class="gallery-section">
            <h3 class="section-title">Nuestros Trabajos</h3>
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="https://i.postimg.cc/T32G8NfQ/IMG-20260212-WA0003.jpg" alt="Corte 1">
                </div>
                <div class="gallery-item">
                    <img src="https://i.postimg.cc/CxMYyrSm/IMG-20260212-WA0004.jpg" alt="Corte 2">
                </div>
                <div class="gallery-item">
                    <img src="https://i.postimg.cc/zGD5m28n/IMG-20260212-WA0005.jpg" alt="Corte 3">
                </div>
                <div class="gallery-item">
                    <img src="https://i.postimg.cc/sgfyFHsT/IMG-20260212-WA0006.jpg" alt="Corte 4">
                </div>
            </div>
        </section>

        <section class="services-section" id="services">
            <h3 class="section-title">Servicios</h3>
            <div class="services-grid" id="services-container"></div>
        </section>

        <section class="calendar-section">
            <h3 class="section-title">Fecha y Hora</h3>
            <div class="calendar-container">
                <div id="current-month" style="text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 1.2rem;"></div>
                <div class="calendar-grid" id="calendar-days"></div>
                <div class="time-slots" id="time-slots" style="display: none;"></div>
            </div>
        </section>

        <section class="booking-form" id="booking-form" style="display: none;">
            <h3 class="section-title">Tus Datos</h3>
            <div class="form-group">
                <input type="text" class="form-input" id="client-name" placeholder="Nombre completo">
            </div>
            <div class="form-group">
                <input type="tel" class="form-input" id="client-phone" placeholder="WhatsApp (Ej: 11 1234 5678)">
            </div>
            <button class="btn-primary" onclick="confirmBooking()">Confirmar Reserva</button>
        </section>

        <section class="contact-info">
            <h3>Contacto</h3>
            <p><i class="fas fa-map-marker-alt"></i> Enrique Dunant 626, Buenos Aires</p>
            <p><i class="fas fa-phone-alt"></i> 011-2351-7723</p>
        </section>
    </main>

    <div class="modal" id="confirmation-modal">
        <div class="modal-content">
            <i class="fas fa-check-circle" style="font-size: 4rem; color: #2ecc71; margin-bottom: 20px;"></i>
            <h3>¡Reserva Exitosa!</h3>
            <p id="confirmation-details"></p>
            <button class="btn-primary" onclick="location.reload()" style="margin-top: 20px;">Cerrar</button>
        </div>
    </div>

    <div id="notification"></div>

    <script>
        const SERVICES = [
            { id: 1, name: 'Corte de Cabello', price: 9000, duration: 30, icon: 'cut' },
            { id: 2, name: 'Arreglo de Barba', price: 5000, duration: 20, icon: 'user-tie' },
            { id: 3, name: 'Combo Full', price: 12000, duration: 50, icon: 'star' }
        ];

        let selectedService = null;
        let selectedDate = null;
        let selectedTime = null;

        function renderServices() {
            const container = document.getElementById('services-container');
            container.innerHTML = SERVICES.map(s => `
                <div class="service-card" onclick="selectService(${s.id})" id="service-${s.id}">
                    <div class="service-icon"><i class="fas fa-${s.icon}"></i></div>
                    <h4>${s.name}</h4>
                    <div class="service-price">$${s.price.toLocaleString()}</div>
                    <p>${s.duration} min</p>
                </div>
            `).join('');
        }

        function selectService(id) {
            selectedService = SERVICES.find(s => s.id === id);
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(`service-${id}`).classList.add('selected');
            document.getElementById('cart-count').innerText = "1";
            renderCalendar();
        }

        function renderCalendar() {
            const daysContainer = document.getElementById('calendar-days');
            const now = new Date();
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('current-month').innerText = monthNames[now.getMonth()] + " " + now.getFullYear();

            let html = '';
            for(let i=0; i<14; i++) {
                let date = new Date();
                date.setDate(now.getDate() + i);
                let dayName = date.toLocaleDateString('es', {weekday: 'short'});
                let isSelected = selectedDate && date.toDateString() === selectedDate.toDateString();
                
                html += `
                    <div class="calendar-day ${isSelected ? 'selected' : ''}" onclick="selectDate('${date.toISOString()}')">
                        <div>
                            <div style="font-size: 0.7rem; text-transform: uppercase;">${dayName}</div>
                            <div style="font-size: 1.1rem; font-weight: bold;">${date.getDate()}</div>
                        </div>
                    </div>
                `;
            }
            daysContainer.innerHTML = html;
        }

        function selectDate(dateIso) {
            selectedDate = new Date(dateIso);
            renderCalendar();
            renderTimeSlots();
        }

        function renderTimeSlots() {
            const container = document.getElementById('time-slots');
            container.style.display = 'grid';
            const slots = ["09:00", "10:00", "11:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
            
            container.innerHTML = slots.map(s => `
                <div class="time-slot ${selectedTime === s ? 'selected' : ''}" onclick="selectTime('${s}')">${s}</div>
            `).join('');
        }

        function selectTime(time) {
            selectedTime = time;
            renderTimeSlots();
            document.getElementById('booking-form').style.display = 'block';
            window.scrollTo({ top: document.getElementById('booking-form').offsetTop - 100, behavior: 'smooth' });
        }

        function confirmBooking() {
            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;
            if(!name || !phone) return alert("Por favor completa tus datos");

            const details = `Turno para ${name} - ${selectedService.name} el ${selectedDate.toLocaleDateString()} a las ${selectedTime}hs.`;
            document.getElementById('confirmation-details').innerText = details;
            document.getElementById('confirmation-modal').classList.add('active');
            
            // Enviar WhatsApp (Simulado)
            const waMsg = encodeURIComponent(`Hola! Reservé un turno: ${details}`);
            window.open(`https://wa.me/5491123517723?text=${waMsg}`, '_blank');
        }

        function scrollToServices() {
            document.getElementById('services').scrollIntoView({ behavior: 'smooth' });
        }

        renderServices();
    </script>
</body>
</html>

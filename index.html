<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feli_Style Barbería | Reservas Premium</title>
    
    <!-- Fuentes y Estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0a0a0a;
            --accent: #c9a86a;
            --accent-light: #e6d7b8;
            --light: #f8f8f8;
            --white: #ffffff;
            --success: #2ecc71;
            --border: #e0e0e0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f7ef8a 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--white); color: var(--primary); line-height: 1.6; overflow-x: hidden; }
        h1, h2, h3, h4, .section-title { font-family: 'Poppins', sans-serif; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* HEADER */
        header {
            background: rgba(10, 10, 10, 0.98); color: white; padding: 1rem 0; position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 50px; width: auto; border-radius: 8px; border: 1.5px solid var(--accent); }
        .logo h1 { font-size: 1.2rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* HERO */
        .hero {
            text-align: center; padding: 60px 20px; color: white; margin-bottom: 30px; border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=2074');
            background-size: cover; background-position: center;
        }

        /* GALERIA (Reemplaza Acceso Rápido) */
        .gallery-section { padding: 40px 0; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .gallery-item {
            height: 200px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow);
        }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .gallery-item:hover img { transform: scale(1.1); }

        /* SERVICIOS */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .service-card { 
            background: white; border-radius: var(--radius-md); padding: 25px; border: 1px solid var(--border); 
            cursor: pointer; transition: var(--transition); position: relative;
        }
        .service-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .service-card.selected { border: 2.5px solid var(--accent); background: #fffcf5; }
        .service-icon { font-size: 1.8rem; color: var(--accent); margin-bottom: 10px; }
        .service-price { font-size: 1.4rem; font-weight: 700; color: var(--primary); }

        /* CALENDARIO */
        .calendar-container { background: white; border-radius: var(--radius-lg); padding: 25px; border: 1px solid var(--border); margin-bottom: 25px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .calendar-day-header { text-align: center; font-weight: 700; font-size: 0.7rem; color: #999; text-transform: uppercase; padding: 5px 0; }
        .calendar-day { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border-radius: 10px; border: 1px solid #f0f0f0; font-size: 0.9rem; transition: 0.2s;
        }
        .calendar-day:hover:not(.disabled) { background: var(--accent-light); }
        .calendar-day.selected { background: var(--accent) !important; color: white !important; font-weight: bold; border-color: var(--accent); }
        .calendar-day.disabled { color: #ccc; cursor: not-allowed; background: #fafafa; border: none; }
        .calendar-day.today { border: 2px solid var(--accent); color: var(--accent); font-weight: 700; }

        .time-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 20px; }
        .time-slot { padding: 12px; text-align: center; background: var(--light); border-radius: 10px; cursor: pointer; border: 1.5px solid transparent; font-weight: 600; }
        .time-slot.selected { background: var(--accent); color: white; border-color: var(--accent); }

        /* FORMULARIO */
        .booking-form { background: white; border-radius: var(--radius-lg); padding: 30px; border: 1px solid var(--border); margin-bottom: 50px; }
        .form-input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; font-size: 1rem; outline: none; }
        .form-input:focus { border-color: var(--accent); }
        .btn-primary { 
            width: 100%; padding: 18px; background: var(--primary); color: white; 
            border-radius: 12px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary:active { transform: scale(0.98); }

        /* UTILIDADES */
        .section-title { text-align: center; font-size: 1.6rem; margin: 40px 0 20px; position: relative; padding-bottom: 10px; }
        .section-title:after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 50px; height: 3px; background: var(--accent); }
        .hidden { display: none !important; }

        /* MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 40px; border-radius: var(--radius-lg); text-align: center; max-width: 400px; }

        @media (max-width: 480px) {
            .big-number { font-size: 6rem; }
            .calendar-day { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="logo">
                <img src="https://i.postimg.cc/s2dsJwRZ/IMG-20260122-WA0001.jpg" class="logo-img">
                <div class="logo-text">
                    <h1>Feli_Style</h1>
                </div>
            </div>
            <div style="display: flex; gap: 15px; font-size: 1.2rem; color: var(--accent);">
                <i class="fab fa-instagram"></i>
                <i class="fab fa-whatsapp"></i>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Experiencia Premium</h2>
            <p>Reserva tu lugar en segundos.</p>
        </section>

        <!-- SECCIÓN GALERÍA DE TRABAJOS -->
        <section class="gallery-section">
            <h3 class="section-title">Nuestros Trabajos</h3>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="https://i.postimg.cc/T32G8NfQ/IMG-20260212-WA0003.jpg" alt="Trabajo 1"></div>
                <div class="gallery-item"><img src="https://i.postimg.cc/CxMYyrSm/IMG-20260212-WA0004.jpg" alt="Trabajo 2"></div>
                <div class="gallery-item"><img src="https://i.postimg.cc/zGD5m28n/IMG-20260212-WA0005.jpg" alt="Trabajo 3"></div>
                <div class="gallery-item"><img src="https://i.postimg.cc/sgfyFHsT/IMG-20260212-WA0006.jpg" alt="Trabajo 4"></div>
            </div>
        </section>

        <section id="services">
            <h3 class="section-title">Servicios</h3>
            <div class="services-grid" id="services-container"></div>
        </section>

        <section class="calendar-section hidden" id="calendar-section">
            <h3 class="section-title">Selecciona Fecha</h3>
            <div class="calendar-container">
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)" style="background:none; border:none; cursor:pointer;"><i class="fas fa-chevron-left"></i></button>
                    <h4 id="current-month-name">Marzo 2026</h4>
                    <button onclick="changeMonth(1)" style="background:none; border:none; cursor:pointer;"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid" id="calendar-days"></div>
            </div>
            
            <div id="time-container" class="calendar-container hidden">
                <h4 style="text-align: center; margin-bottom: 15px;">Horarios disponibles</h4>
                <div class="time-slots" id="time-slots"></div>
            </div>
        </section>

        <section class="booking-form hidden" id="booking-form">
            <h3 class="section-title">Tus Datos</h3>
            <input type="text" class="form-input" id="client-name" placeholder="Tu nombre">
            <input type="tel" class="form-input" id="client-phone" placeholder="WhatsApp (Ej: 11 1234 5678)">
            <button class="btn-primary" onclick="confirmBooking()">Finalizar Reserva</button>
        </section>
    </main>

    <!-- Modal de Éxito -->
    <div class="modal" id="confirmation-modal">
        <div class="modal-content">
            <i class="fas fa-check-circle" style="font-size: 3rem; color: var(--success); margin-bottom: 15px;"></i>
            <h3>¡Turno Reservado!</h3>
            <p id="confirmation-details" style="margin: 15px 0; font-size: 0.9rem; color: #666;"></p>
            <button class="btn-primary" onclick="location.reload()">Cerrar</button>
        </div>
    </div>

    <script>
        const SERVICES = [
            { id: '1', name: 'Corte de Cabello', duration: 30, price: 9000, icon: 'cut' },
            { id: '2', name: 'Corte Niños (hasta 11 años)', duration: 35, price: 7000, icon: 'child' },
            { id: '3', name: 'Arreglo de Barba', duration: 35, price: 2000, icon: 'user-tie' },
            { id: '4', name: 'Afeitado Tradicional', duration: 15, price: 3000, icon: 'hand-sparkles' },
            { id: '5', name: 'Perfilado de Ceja', duration: 10, price: 2000, icon: 'eye' },
            { id: '6', name: 'Corte + Barba', duration: 40, price: 10000, icon: 'crown' },
            { id: '7', name: 'Corte + Cejas + Barba', duration: 50, price: 12000, icon: 'star' }
        ];

        const TIME_SLOTS = ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00"];

        let selectedService = null;
        let selectedDate = null;
        let selectedTime = null;
        let viewDate = new Date(); // Para navegar meses

        function renderServices() {
            const container = document.getElementById('services-container');
            container.innerHTML = SERVICES.map(s => `
                <div class="service-card" onclick="selectService('${s.id}')" id="service-${s.id}">
                    <div class="service-icon"><i class="fas fa-${s.icon}"></i></div>
                    <div class="service-price">$${s.price.toLocaleString()}</div>
                    <h4 style="margin: 5px 0">${s.name}</h4>
                    <p style="font-size: 0.8rem; color: #888">${s.duration} min</p>
                </div>
            `).join('');
        }

        function selectService(id) {
            selectedService = SERVICES.find(s => s.id === id);
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(`service-${id}`).classList.add('selected');
            document.getElementById('calendar-section').classList.remove('hidden');
            renderCalendar();
            document.getElementById('calendar-section').scrollIntoView({ behavior: 'smooth' });
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-days');
            const monthLabel = document.getElementById('current-month-name');
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            monthLabel.innerText = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate(); // AQUÍ SE CALCULA BIEN (Marzo = 31)

            let html = ["Dom","Lun","Mar","Mie","Jue","Vie","Sab"].map(d => `<div class="calendar-day-header">${d}</div>`).join('');
            
            for(let i=0; i<firstDay; i++) html += `<div class="calendar-day disabled"></div>`;
            
            const today = new Date();
            today.setHours(0,0,0,0);

            for(let d=1; d<=daysInMonth; d++) {
                const date = new Date(year, month, d);
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isPast = date < today;
                const isSelected = selectedDate === dateStr;
                
                html += `<div class="calendar-day ${isPast ? 'disabled' : ''} ${isSelected ? 'selected' : ''}" 
                             onclick="${isPast ? '' : `selectDate('${dateStr}')`}">${d}</div>`;
            }
            container.innerHTML = html;
        }

        function changeMonth(val) {
            viewDate.setMonth(viewDate.getMonth() + val);
            renderCalendar();
        }

        function selectDate(dateStr) {
            selectedDate = dateStr;
            renderCalendar();
            document.getElementById('time-container').classList.remove('hidden');
            renderTimeSlots();
        }

        function renderTimeSlots() {
            const container = document.getElementById('time-slots');
            container.innerHTML = TIME_SLOTS.map(t => `
                <div class="time-slot ${selectedTime === t ? 'selected' : ''}" onclick="selectTime('${t}')">${t}</div>
            `).join('');
        }

        function selectTime(t) {
            selectedTime = t;
            renderTimeSlots();
            document.getElementById('booking-form').classList.remove('hidden');
            document.getElementById('booking-form').scrollIntoView({ behavior: 'smooth' });
        }

        function confirmBooking() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if(!name || !phone) return alert("Por favor, completa tus datos.");
            if(!selectedService || !selectedDate || !selectedTime) return alert("Faltan datos de la reserva.");

            const fechaFormat = new Date(selectedDate + "T00:00:00").toLocaleDateString('es-AR');
            const msg = `*¡Hola Feli_Style!*%0AQuisiera reservar un turno:%0A%0A👤 *Nombre:* ${name}%0A✂️ *Servicio:* ${selectedService.name}%0A📅 *Fecha:* ${fechaFormat}%0A⏰ *Hora:* ${selectedTime} hs.%0A%0A_Enviado desde la web oficial._`;

            // Mostrar modal
            document.getElementById('confirmation-details').innerHTML = `<b>${selectedService.name}</b><br>${fechaFormat} a las ${selectedTime} hs.`;
            document.getElementById('confirmation-modal').classList.add('active');

            // Abrir WhatsApp con delay para evitar bloqueo de popup
            setTimeout(() => {
                window.open(`https://wa.me/5491123517723?text=${msg}`, '_blank');
            }, 800);
        }

        renderServices();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feli_Style Barbería | Reservas Elegantes</title>
    
    <!-- SEO y Meta Tags originales -->
    <meta name="description" content="Agenda online exclusiva para Feli_Style Barbería.">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/s2dsJwRZ/IMG-20260122-WA0001.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0a0a0a;
            --secondary: #2a2a2a;
            --accent: #c9a86a;
            --accent-light: #e6d7b8;
            --dark: #1a1a1a;
            --light: #f8f8f8;
            --white: #ffffff;
            --gray: #777777;
            --danger: #cc3333;
            --success: #2ecc71;
            --border: #e0e0e0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f7ef8a 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--white); color: var(--dark); line-height: 1.6; overflow-x: hidden; }
        h1, h2, h3, h4, .section-title, .logo h1, .hero h2, .calendar-title { font-family: 'Poppins', sans-serif; font-weight: 600; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        header {
            background: rgba(10, 10, 10, 0.95); color: white; padding: 1.4rem 0; position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 16px; }
        .logo-img { height: 56px; width: auto; border-radius: var(--radius-sm); border: 2px solid var(--accent); }
        .logo h1 { font-size: 1.4rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* ===== NUEVA SECCIÓN GALERÍA (TRABAJOS REALES) ===== */
        .gallery-section { padding: 40px 0 60px; text-align: center; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .gallery-item {
            height: 300px;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        .gallery-item:hover img { transform: scale(1.08); }

        /* HERO */
        .hero {
            text-align: center; padding: 80px 20px; color: white; margin-bottom: 50px; border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=2074');
            background-size: cover; background-position: center;
        }
        .cta-button { background: var(--accent); color: var(--primary); padding: 18px 42px; border-radius: 50px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; }

        /* SERVICIOS */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .service-card { background: white; border-radius: var(--radius-md); padding: 30px; border: 1px solid var(--border); cursor: pointer; transition: var(--transition); position: relative; }
        .service-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: var(--shadow-hover); }
        .service-card.selected { border: 2px solid var(--accent); background: #fffcf5; }
        .service-icon { font-size: 2.2rem; color: var(--accent); margin-bottom: 15px; }
        .service-price { font-size: 1.6rem; font-weight: 700; color: var(--primary); }

        /* CALENDARIO ORIGINAL REFORZADO */
        .calendar-container { background: white; border-radius: var(--radius-lg); padding: 30px; border: 1px solid var(--border); margin-bottom: 30px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .calendar-day-header { text-align: center; font-weight: 700; padding: 10px; font-size: 0.8rem; background: var(--light); border-radius: 5px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; border: 1px solid #eee; transition: 0.2s; }
        .calendar-day:hover:not(.disabled) { background: var(--accent-light); }
        .calendar-day.selected { background: var(--accent); color: white; border-color: var(--accent); }
        .calendar-day.disabled { color: #ccc; cursor: not-allowed; background: #f9f9f9; }
        .calendar-day.today { border: 2px solid var(--accent); font-weight: bold; }

        .time-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        .time-slot { padding: 12px; text-align: center; background: var(--light); border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .time-slot.selected { background: var(--accent); color: white; }

        /* FORMULARIO */
        .booking-form { background: white; border-radius: var(--radius-lg); padding: 35px; border: 1px solid var(--border); margin-bottom: 60px; }
        .form-input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; font-size: 1rem; }
        .btn-primary { width: 100%; padding: 20px; background: var(--primary); color: white; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }

        /* ADMIN */
        .admin-panel { background: white; border: 2px solid var(--primary); border-radius: var(--radius-lg); padding: 30px; margin: 40px 0; display: none; }
        .admin-panel.visible { display: block; }
        .appointment-item { background: var(--light); padding: 20px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }

        .section-title { text-align: center; font-size: 1.8rem; margin: 50px 0 30px; position: relative; padding-bottom: 15px; }
        .section-title:after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 4px; background: var(--gold-gradient); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 40px; border-radius: var(--radius-lg); text-align: center; max-width: 450px; width: 100%; }

        #notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 15px 30px; border-radius: 50px; display: none; z-index: 3000; }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <img src="https://i.postimg.cc/s2dsJwRZ/IMG-20260122-WA0001.jpg" class="logo-img">
                <div class="logo-text">
                    <h1>Feli_Style</h1>
                    <span style="font-size: 0.7rem; color: var(--accent-light); text-transform: uppercase;">Barbería de Excelencia</span>
                </div>
            </div>
            <button class="cta-button" style="padding: 8px 20px; font-size: 0.8rem;" onclick="scrollToServices()">Reservar</button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Experiencia Barbería Premium</h2>
            <p>Donde el estilo se encuentra con la excelencia.</p>
            <button class="cta-button" style="margin-top: 20px;" onclick="scrollToServices()">Ver Servicios</button>
        </section>

        <!-- SECCIÓN DE FOTOS (Reemplaza al QR) -->
        <section class="gallery-section">
            <h3 class="section-title">Trabajos Reales</h3>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=2070"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=2070"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1599351431247-f10b21ce963f?q=80&w=1974"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1622286332618-f2803b11558c?q=80&w=2070"></div>
            </div>
        </section>

        <section id="services">
            <h3 class="section-title">Nuestros Servicios</h3>
            <div class="services-grid" id="services-container"></div>
        </section>

        <section class="calendar-section">
            <h3 class="section-title">Fecha y Hora</h3>
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prev-month" style="border:none; background:none; cursor:pointer;"><i class="fas fa-chevron-left"></i></button>
                    <div class="calendar-title" id="current-month"></div>
                    <button id="next-month" style="border:none; background:none; cursor:pointer;"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid" id="calendar-days"></div>
            </div>

            <div class="calendar-container" id="time-slots-container" style="display: none;">
                <h4>Horarios para el <span id="selected-date-display"></span></h4>
                <div class="time-slots" id="time-slots"></div>
            </div>
        </section>

        <section class="booking-form" id="booking-form" style="display: none;">
            <h3 class="section-title">Tus Datos</h3>
            <input type="text" class="form-input" id="client-name" placeholder="Nombre completo">
            <input type="tel" class="form-input" id="client-phone" placeholder="WhatsApp (11 1234 5678)">
            <button class="btn-primary" onclick="confirmBooking()">Confirmar Turno</button>
        </section>

        <!-- PANEL ADMIN (OCULTO) -->
        <div class="admin-panel" id="admin-panel">
            <h3>Turnos Programados</h3>
            <div id="appointments-list"></div>
        </div>

        <div style="text-align: center; margin-bottom: 40px;">
            <button style="background: none; border: 1px solid #ccc; padding: 10px; cursor: pointer; color: #999;" onclick="checkAdminAccess()">Acceso Admin</button>
        </div>
    </main>

    <div class="modal" id="confirmation-modal">
        <div class="modal-content">
            <i class="fas fa-check-circle" style="font-size: 4rem; color: var(--success); margin-bottom: 20px;"></i>
            <h3>¡Reserva Confirmada!</h3>
            <p id="confirmation-details" style="margin: 15px 0;"></p>
            <button class="btn-primary" onclick="location.reload()">Aceptar</button>
        </div>
    </div>

    <div id="notification"></div>

    <script>
        const CONFIG = {
            ADMIN: { user: "admin", pass: "feli123" },
            DEFAULT_SERVICES: [
                { id: '1', name: 'Corte de Cabello', duration: 30, price: 9000, icon: 'cut' },
                { id: '2', name: 'Corte Niños (hasta 11 años)', duration: 35, price: 7000, icon: 'child' },
                { id: '3', name: 'Arreglo de Barba Completo', duration: 35, price: 2000, icon: 'user-tie' },
                { id: '4', name: 'Afeitado Tradicional', duration: 15, price: 3000, icon: 'razor' },
                { id: '5', name: 'Perfilado de Ceja', duration: 10, price: 2000, icon: 'eye' },
                { id: '6', name: 'Corte + Barba', duration: 40, price: 10000, icon: 'crown' },
                { id: '7', name: 'Corte + Cejas + Barba', duration: 50, price: 12000, icon: 'star' }
            ]
        };

        let selectedServices = [];
        let selectedDate = null;
        let selectedTime = null;
        let appointments = JSON.parse(localStorage.getItem('feli_appointments')) || [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        function renderServices() {
            const container = document.getElementById('services-container');
            container.innerHTML = CONFIG.DEFAULT_SERVICES.map(s => `
                <div class="service-card" onclick="toggleService('${s.id}')" id="service-${s.id}">
                    <div class="service-icon"><i class="fas fa-cut"></i></div>
                    <h4>${s.name}</h4>
                    <div class="service-price">$${s.price.toLocaleString()}</div>
                    <p>${s.duration} min</p>
                </div>
            `).join('');
        }

        function toggleService(id) {
            const service = CONFIG.DEFAULT_SERVICES.find(s => s.id === id);
            selectedServices = [service]; // Selección simple para esta versión
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(`service-${id}`).classList.add('selected');
            renderCalendar();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-days');
            const monthTitle = document.getElementById('current-month');
            const names = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            
            monthTitle.innerText = `${names[currentMonth]} ${currentYear}`;
            
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date();
            today.setHours(0,0,0,0);

            let html = ["Dom","Lun","Mar","Mie","Jue","Vie","Sab"].map(d => `<div class="calendar-day-header">${d}</div>`).join('');
            
            for(let i=0; i<firstDay; i++) html += `<div class="calendar-day disabled"></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const date = new Date(currentYear, currentMonth, d);
                const dateStr = date.toISOString().split('T')[0];
                const isPast = date < today;
                const isSelected = selectedDate === dateStr;
                
                html += `<div class="calendar-day ${isPast ? 'disabled' : ''} ${isSelected ? 'selected' : ''} ${date.toDateString() === new Date().toDateString() ? 'today' : ''}" 
                             onclick="${isPast ? '' : `selectDate('${dateStr}')`}">${d}</div>`;
            }
            container.innerHTML = html;
        }

        function selectDate(dateStr) {
            selectedDate = dateStr;
            renderCalendar();
            document.getElementById('selected-date-display').innerText = dateStr;
            document.getElementById('time-slots-container').style.display = 'block';
            renderTimeSlots();
        }

        function renderTimeSlots() {
            const container = document.getElementById('time-slots');
            const slots = ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00"];
            container.innerHTML = slots.map(s => `
                <div class="time-slot ${selectedTime === s ? 'selected' : ''}" onclick="selectTime('${s}')">${s}</div>
            `).join('');
        }

        function selectTime(time) {
            selectedTime = time;
            renderTimeSlots();
            document.getElementById('booking-form').style.display = 'block';
        }

        function confirmBooking() {
            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;
            if(!name || !phone) return alert("Completa tus datos");

            const appointment = { name, phone, date: selectedDate, time: selectedTime, service: selectedServices[0].name };
            appointments.push(appointment);
            localStorage.setItem('feli_appointments', JSON.stringify(appointments));

            document.getElementById('confirmation-details').innerText = `${selectedServices[0].name} - ${selectedDate} a las ${selectedTime}hs.`;
            document.getElementById('confirmation-modal').classList.add('active');

            const msg = encodeURIComponent(`Hola! Reserva de ${name}: ${selectedServices[0].name} el ${selectedDate} a las ${selectedTime}hs.`);
            window.open(`https://wa.me/5491123517723?text=${msg}`, '_blank');
        }

        function checkAdminAccess() {
            const pass = prompt("Contraseña admin:");
            if(pass === CONFIG.ADMIN.pass) {
                document.getElementById('admin-panel').classList.add('visible');
                renderAdminList();
            }
        }

        function renderAdminList() {
            const list = document.getElementById('appointments-list');
            list.innerHTML = appointments.map(a => `
                <div class="appointment-item">
                    <div>
                        <b>${a.name}</b> (${a.phone})<br>
                        ${a.service} - ${a.date} ${a.time}hs
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('prev-month').onclick = () => { currentMonth--; if(currentMonth<0){currentMonth=11; currentYear--;} renderCalendar(); };
        document.getElementById('next-month').onclick = () => { currentMonth++; if(currentMonth>11){currentMonth=0; currentYear++;} renderCalendar(); };

        function scrollToServices() { document.getElementById('services').scrollIntoView({ behavior: 'smooth' }); }

        renderServices();
        renderCalendar();
    </script>
</body>
</html>
